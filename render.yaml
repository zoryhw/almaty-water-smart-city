services:
  - type: web
    name: smart-city-water-api
    runtime: python
    autoDeployTrigger: commit
    buildCommand: pip install -r back/requirements.txt && python back/manage.py collectstatic --noinput
    preDeployCommand: python back/manage.py migrate --noinput
    startCommand: gunicorn --chdir back config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - back/**
        - render.yaml
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: smart-city-water
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        - vite.config.js
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
